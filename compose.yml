services:
  api:
    build: .
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bomadb
      SECRET_KEY: eddf90ded1a972814cbe3d16c6844a8ac92032f1945366c16938021632fbf280
      ALGORITHM: HS256

    expose:
      - 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "bomadb"
    ports:
      - "5433:5432"
    volumes:
      - ./postgresql_data:/var/postgresql/data





